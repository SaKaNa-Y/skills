name: Repository references

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references:
    name: Check repository references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install checker dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Test reference checker
        run: python -m unittest discover -s tests -v
      - name: Check public references
        run: python scripts/check_markdown_links.py --root .
